services:
  app:
    build: .
    container_name: hospital-app
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    depends_on:
      - postgres

  postgres:
    image: postgres:17
    container_name: hospital-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hospital_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:latest
    container_name: hospital-nginx
    ports:
      - "80:80"
    depends_on:
      - app

volumes:
  postgres_data:
